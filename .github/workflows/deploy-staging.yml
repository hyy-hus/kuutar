name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One staging deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: staging-${{ github.sha }}
    secrets: inherit
