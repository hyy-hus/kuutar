name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud/kuutar-staging -u nologin --password-stdin

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: rg.fr-par.scw.cloud/kuutar-staging/kuutar-backend:staging-${{ github.sha }}

      - name: Install Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}
          default-region: fr-par

      - name: Deploy Container to Scaleway
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            image="rg.fr-par.scw.cloud/kuutar-staging/kuutar-backend:staging-${{ github.sha }}" \
            redeploy=true

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install & Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync SPA to Scaleway S3 Bucket
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://s3.fr-par.scw.cloud
          SOURCE_DIR: "./dist"
