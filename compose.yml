services:
  postgres:
    image: postgres:18-alpine
    container_name: kuutar_db
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  # Local mail catcher: SMTP on 1025, web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: kuutar_mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
